<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Love You Sabbu 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: radial-gradient(circle at top, #ffafbd, #ffc3a0);
      font-family: 'Pacifico', cursive;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .container.active {
      display: flex;
    }

    .love-text {
      font-size: 4rem;
      color: #fff;
      text-shadow:
        1px 1px 0 #f093fb,
        2px 2px 0 #f5576c,
        3px 3px 0 #c33764,
        4px 4px 0 #1d2671;
      animation: floatText 3s ease-in-out infinite;
    }

    @keyframes floatText {
      0%, 100% { transform: translateY(0) rotateX(0deg); }
      50% { transform: translateY(-20px) rotateX(10deg); }
    }

    .buttons {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .buttons button {
      font-family: 'Pacifico', cursive;
      font-size: 1.5rem;
      padding: 10px 25px;
      border: none;
      border-radius: 20px;
      background: #ff6f91;
      color: white;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .buttons button:hover {
      background: #ff4e7a;
      transform: scale(1.05);
    }

    .response {
      margin-top: 20px;
      font-size: 2rem;
      color: #fff;
      display: none;
    }

    .hearts {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: -1;
    }

    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      transform: rotate(45deg);
      animation: floatHearts 5s linear infinite;
    }

    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      border-radius: 50%;
    }

    .heart::before { top: -10px; left: 0; }
    .heart::after { left: -10px; top: 0; }

    @keyframes floatHearts {
      0% { transform: translateY(0) rotate(45deg); opacity: 1; }
      100% { transform: translateY(-100vh) rotate(45deg); opacity: 0; }
    }

    /* Punishment Section */
    .punishments ul {
      list-style: none;
      padding: 0;
      font-size: 1.8rem;
      color: white;
    }

    .punishments ul li {
      margin: 15px 0;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      transition: 0.3s ease;
    }

    .punishments ul li:hover {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.3);
    }

    .back-button {
      margin-top: 30px;
      font-size: 1.2rem;
      background: #ff6f91;
      padding: 10px 20px;
      border-radius: 20px;
      color: white;
      cursor: pointer;
      border: none;
    }

    .back-button:hover {
      background: #ff4e7a;
    }
  </style>
</head>
<body>
  <!-- Love Page -->
  <div class="container active" id="love-page">
    <div class="love-text">Love You Sabbu 💖</div>

    <div class="buttons">
      <button onclick="showResponse()">Accept</button>
      <button onclick="showResponse()">Reject</button>
      <button onclick="goToPunishments()">Punishments 😈</button>
    </div>

    <div class="response" id="response">Kamde debo 💍💖</div>
  </div>

  <!-- Punishment Page -->
  <div class="container" id="punishment-page">
    <h1>Choose Your Punishment 😈</h1>
    <div class="punishments">
      <ul>
        <li>👢 Kick You</li>
        <li>😾 Bite You</li>
        <li>🏠 Left Home</li>
        <li>🕴️ Stand Outside</li>
        <li>🍔 Take Foods for Me</li>
      </ul>
    </div>
    <button class="back-button" onclick="goBack()">Go Back 💌</button>
  </div>

  <!-- Animated Hearts -->
  <div class="hearts">
    <div class="heart" style="left:10%; animation-delay: 0s;"></div>
    <div class="heart" style="left:30%; animation-delay: 1s;"></div>
    <div class="heart" style="left:50%; animation-delay: 2s;"></div>
    <div class="heart" style="left:70%; animation-delay: 1.5s;"></div>
    <div class="heart" style="left:90%; animation-delay: 0.5s;"></div>
  </div>

  <!-- Script to switch pages -->
  <script>
    function showResponse() {
      document.getElementById('response').style.display = 'block';
    }

    function goToPunishments() {
      document.getElementById('love-page').classList.remove('active');
      document.getElementById('punishment-page').classList.add('active');
    }

    function goBack() {
      document.getElementById('punishment-page').classList.remove('active');
      document.getElementById('love-page').classList.add('active');
    }
  </script>
</body>
</html>
