<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Punishments 😈</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: linear-gradient(45deg, #ff9a9e, #fad0c4);
      font-family: 'Pacifico', cursive;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    ul {
      list-style: none;
      padding: 0;
      font-size: 1.8rem;
    }

    ul li {
      margin: 15px 0;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      transition: 0.3s ease;
    }

    ul li:hover {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.3);
    }

    .back-button {
      margin-top: 40px;
      font-size: 1.2rem;
      background: #ff6f91;
      padding: 10px 20px;
      border-radius: 20px;
      color: white;
      cursor: pointer;
      border: none;
    }

    .back-button:hover {
      background: #ff4e7a;
    }
  </style>
</head>
<body>
  <h1>Choose Your Punishment 😈</h1>
  <ul>
    <li>👢 Kick You</li>
    <li>😾 Bite You</li>
    <li>🏠 Left Home</li>
    <li>🕴️ Stand Outside</li>
    <li>🍔 Take Foods for Me</li>
  </ul>
  <button class="back-button" onclick="window.location.href='index.html'">Go Back 💌</button>
</body>
</html>
